<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060403">
<title>גן הנברשות — אולם וגן אירועים</title>
<meta name="description" content="אתר לדוגמה: אולם אירועים בדוי, אתר תלת־ממד בגלילה.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&family=Noto+Kufi+Arabic:wght@400;600;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root { --bg: #060403; --ink: #f6ecdc; --mute: rgba(246, 236, 220, .68); --gold: #d9b06a; --gold2: #f3d69d; --line: rgba(243, 214, 157, .2); --ease: cubic-bezier(.2, .7, .1, 1); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; }
body { font-family: 'Assistant', 'Noto Kufi Arabic', system-ui, sans-serif; background: var(--bg); overflow-x: hidden; }
html[lang="ar"] body { font-family: 'Noto Kufi Arabic', 'Assistant', system-ui, sans-serif; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100lvh; z-index: 0; display: block; }
#vids { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; overflow: hidden; }
#vids video { width: 2px; height: 2px; }

#loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); transition: opacity .9s var(--ease), visibility .9s; }
#loader img { width: min(260px, 60vw); animation: lpulse 2.2s ease-in-out infinite; }
#loader i { position: absolute; bottom: 18vh; width: 120px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: lline 1.4s ease-in-out infinite; }
#loader.off { opacity: 0; visibility: hidden; }
@keyframes lpulse { 50% { opacity: .55; transform: scale(.985); } }
@keyframes lline { 0% { transform: scaleX(.2); opacity: .2; } 50% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(.2); opacity: .2; } }

header#top { position: fixed; top: 0; inset-inline: 0; z-index: 20; height: calc(62px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left)); display: flex; align-items: center; justify-content: space-between; gap: 16px; background: linear-gradient(180deg, rgba(6, 4, 3, .7), rgba(6, 4, 3, 0)); }
.brand img { height: 36px; width: auto; filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .8)); }
.right { display: flex; align-items: center; gap: 10px; }
.lang { display: flex; background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .12); border-radius: 999px; padding: 3px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.lang button { all: unset; cursor: pointer; font: 600 13px/1 'Assistant', 'Noto Kufi Arabic', sans-serif; color: var(--mute); padding: 7px 11px; border-radius: 999px; }
.lang button.on { background: var(--ink); color: #120c08; }
#demo { position: fixed; z-index: 19; top: calc(66px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--gold2); padding: 6px 14px; border-radius: 999px; background: rgba(0, 0, 0, .5); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); white-space: nowrap; pointer-events: none; transition: opacity .4s; }

.pill { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 26px; border-radius: 999px; font-weight: 700; font-size: 16px; transition: transform .35s var(--ease), box-shadow .35s; white-space: nowrap; }
.pill.gold { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #1a1008; box-shadow: 0 12px 34px -10px rgba(217, 176, 106, .6), inset 0 1px 0 rgba(255, 255, 255, .55); }
.pill.ghost { color: var(--ink); background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .2); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.pill:hover { transform: translateY(-2px); }
.pill.sm { min-height: 38px; padding: 0 18px; font-size: 14px; }

#track { position: relative; z-index: 1; height: 620vh; }
.stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; perspective: 1000px; pointer-events: none; }
.cap { position: absolute; opacity: 0; visibility: hidden; will-change: transform, opacity; transform-style: preserve-3d; pointer-events: none; }
.cap.on { pointer-events: auto; }
.cap p, .cap h2, .cap span { text-shadow: 0 2px 24px rgba(0, 0, 0, .9), 0 0 3px rgba(0, 0, 0, .7); }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

.hero { inset: 0; }
.hin { position: absolute; left: 5vw; top: 50%; transform: translateY(-50%); width: min(500px, 34vw); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 26px; }
.hb { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.logo3d img { width: 100%; filter: drop-shadow(0 16px 40px rgba(0, 0, 0, .9)) drop-shadow(0 1px 0 rgba(255, 220, 160, .3)); }
.hero .sub { font-size: clamp(17px, 1.6vw, 21px); max-width: 28ch; }
.cue { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .3em; color: var(--ink); }
.cue i { width: 1px; height: 46px; background: linear-gradient(var(--gold), transparent); animation: cue 1.8s ease-in-out infinite; transform-origin: top; }
@keyframes cue { 0% { transform: scaleY(0); } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

.word { left: 5vw; bottom: calc(10vh + env(safe-area-inset-bottom)); max-width: min(620px, 46vw); text-align: left; }
html[dir="rtl"] .word { text-align: right; }
.word .row { justify-content: flex-start; margin-top: 22px; }
.big { font-family: 'Frank Ruhl Libre', 'Noto Kufi Arabic', serif; font-weight: 900; font-size: clamp(56px, 8.4vw, 140px); line-height: .95; letter-spacing: -.01em; color: #fff4e2; text-shadow: 0 6px 40px rgba(0, 0, 0, .85), 0 2px 4px rgba(0, 0, 0, .6); }
html[lang="ar"] .big { font-family: 'Noto Kufi Arabic', serif; font-weight: 800; line-height: 1.15; }
.big em { font-style: normal; color: var(--gold2); }
.word p { margin-top: 14px; font-size: clamp(18px, 1.5vw, 22px); max-width: 28ch; }
.word .em { color: var(--gold2); font-weight: 700; }

.menu { left: 50%; top: 50%; width: min(760px, 90vw); text-align: center; }
.menu .kicker { font-size: 13px; letter-spacing: .4em; color: var(--gold); }
#menuList { margin: 22px 0 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 40px; text-align: start; }
#menuList div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, .1); }
#menuList b { font-size: clamp(18px, 1.6vw, 22px); font-weight: 800; }
#menuList small { color: var(--mute); font-size: 14px; text-align: end; }

.dots { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
.dots i { width: 6px; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, .25); transition: height .4s var(--ease), background .4s; }
.dots i.on { height: 22px; background: var(--gold); }

.sec { position: relative; z-index: 2; padding: clamp(90px, 13vw, 160px) 0; background: var(--bg); }
.wrap { width: min(1100px, 100% - 40px); margin: 0 auto; }
.title.xl { font-family: 'Frank Ruhl Libre', 'Noto Kufi Arabic', serif; font-weight: 900; font-size: clamp(64px, 11vw, 160px); line-height: 1; background: linear-gradient(180deg, #fff6e6, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
html[lang="ar"] .title.xl { font-family: 'Noto Kufi Arabic', serif; font-weight: 800; line-height: 1.25; }
.lead { font-size: clamp(18px, 1.6vw, 22px); line-height: 1.7; color: var(--mute); margin-top: 24px; max-width: 46ch; }
.note { color: var(--mute); margin-top: 8px; font-size: 14px; }
.visit-grid { margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { border-radius: 26px; padding: 30px; background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .08); }
.card b { font-size: 28px; }
.card p { color: var(--mute); margin-top: 10px; }
.card.actions { display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start; }
.card.actions small { width: 100%; color: var(--mute); font-size: 12px; }
footer { position: relative; z-index: 2; background: var(--bg); text-align: center; padding: 60px 20px calc(60px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255, 255, 255, .06); color: var(--mute); font-size: 14px; }
footer img { height: 70px; margin: 0 auto 16px; }

@media (max-width: 860px) {
  .brand img { height: 30px; }
  header .pill { display: none; }
  .hin { left: 16px; right: 16px; width: auto; top: calc(108px + env(safe-area-inset-top)); bottom: calc(34px + env(safe-area-inset-bottom)); transform: none; justify-content: space-between; }
  .logo3d img { width: min(290px, 72vw); }
  .hero .sub { font-size: 17px; }
  .cue { display: none; }
  .word { left: 20px; right: 20px; max-width: none; bottom: calc(7vh + env(safe-area-inset-bottom)); text-align: center !important; }
  .word .row { justify-content: center; }
  .word p { margin-inline: auto; }
  .big { font-size: clamp(52px, 15vw, 76px); }
  #menuList { grid-template-columns: 1fr; gap: 0; }
  #menuList div { padding: 9px 0; }
  .visit-grid { grid-template-columns: 1fr; }
  .dots { right: 10px; }
}
@media (prefers-reduced-motion: reduce) { .cue i, #loader img, #loader i { animation: none; } }

/* ---------- תרכיב לך שווארמה ---------- */
.build { overflow: hidden; isolation: isolate; }
.bgv { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; z-index: -1; filter: blur(22px) brightness(.28) saturate(1.2); transform: scale(1.05); }
.build::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, var(--bg) 0%, rgba(6, 4, 3, .4) 18%, rgba(6, 4, 3, .4) 82%, var(--bg) 100%); }
.bgrid { margin-top: 46px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 26px; align-items: start; perspective: 1400px; }
.step { padding: 24px 26px; border-radius: 26px; background: rgba(20, 13, 9, .62); border: 1px solid rgba(255, 255, 255, .08); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); margin-bottom: 14px; transform-origin: center top; transition: transform .7s var(--ease), opacity .7s var(--ease); }
.step h3 { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 800; margin-bottom: 16px; }
.step h3 i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; color: #1a1008; background: linear-gradient(180deg, var(--gold2), var(--gold)); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { all: unset; cursor: pointer; box-sizing: border-box; min-height: 46px; padding: 0 20px; display: inline-flex; align-items: center; border-radius: 999px; font-weight: 700; font-size: 16px; color: var(--ink); background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .14); transition: transform .3s var(--ease), background .25s, border-color .25s, color .25s, box-shadow .3s; }
.chip:hover { border-color: rgba(243, 214, 157, .5); }
.chip.on { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #1a1008; border-color: transparent; box-shadow: 0 10px 26px -10px rgba(217, 176, 106, .7); transform: translateY(-2px) translateZ(20px); }
.chip:focus-visible { outline: 2px solid var(--gold2); outline-offset: 3px; }
.step.last { display: grid; gap: 16px; }
.qty { display: flex; align-items: center; gap: 14px; font-weight: 700; }
.qty button { all: unset; cursor: pointer; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .15); }
.qty b { min-width: 24px; text-align: center; font-size: 20px; }
.fld { display: grid; gap: 8px; font-size: 14px; color: var(--mute); }
.fld input { all: unset; box-sizing: border-box; min-height: 48px; padding: 0 16px; border-radius: 14px; background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .14); color: var(--ink); font-size: 16px; }
.fld input:focus { border-color: var(--gold); }
.preview { color: var(--gold2); font-weight: 600; min-height: 1.4em; }
.pill.wide { width: 100%; cursor: pointer; border: 0; font-family: inherit; }
.pill.gold[disabled], .pill.gold.off { opacity: .45; pointer-events: none; }
.order { position: sticky; top: 90px; padding: 26px; border-radius: 26px; background: rgba(20, 13, 9, .72); border: 1px solid rgba(243, 214, 157, .22); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: grid; gap: 16px; box-shadow: 0 40px 80px -40px rgba(0, 0, 0, .9); }
.order h3 { font-size: 22px; font-weight: 800; }
#bList { list-style: none; display: grid; gap: 10px; }
#bList li { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: rgba(255, 255, 255, .05); animation: pop .5s var(--ease); }
#bList li b { display: block; }
#bList li small { color: var(--mute); font-size: 13px; }
#bList li button { all: unset; cursor: pointer; font-size: 13px; color: var(--gold2); white-space: nowrap; }
#bList .empty { background: none; color: var(--mute); padding: 0; animation: none; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
.how { display: grid; gap: 8px; font-size: 14px; color: var(--mute); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .12); border-radius: 999px; padding: 4px; }
.seg button { all: unset; cursor: pointer; text-align: center; padding: 10px; border-radius: 999px; font-weight: 700; color: var(--mute); }
.seg button.on { background: var(--ink); color: #120c08; }
.order small { color: var(--mute); font-size: 12px; }
.sbar { display: none; }
@media (max-width: 860px) {
  .bgrid { grid-template-columns: 1fr; }
  .order { position: static; }
  .step { padding: 20px; }
  .chip { min-height: 44px; padding: 0 16px; font-size: 15px; }
  .sbar { position: fixed; z-index: 15; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 8px 8px 18px; border-radius: 999px; background: rgba(12, 8, 6, .85); border: 1px solid rgba(243, 214, 157, .25); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transform: translateY(140%); transition: transform .5s var(--ease); font-weight: 700; }
  html[dir="rtl"] .sbar { padding: 8px 18px 8px 8px; }
  .sbar.on { transform: none; }
}

.step.pre { opacity: 0; transform: translateY(40px) rotateX(14deg); }
.step.pre.in { opacity: 1; transform: none; }

/* ---- גן הנברשות: לוגו כתוב ותוספות למתכנן האירוע ---- */
.wm { display: inline-grid; justify-items: center; line-height: 1; font-family: "Frank Ruhl Libre", serif; }
.wm b { font-weight: 900; letter-spacing: .01em; color: #f9e9c2; text-shadow: 0 1px 0 rgba(122, 84, 24, .95), 0 2px 16px rgba(0, 0, 0, .8); }
.wm small { font-family: "Assistant", sans-serif; font-weight: 600; letter-spacing: .34em; color: var(--gold2); opacity: .85; margin-top: .5em; white-space: nowrap; }
.brand .wm b { font-size: 24px; } .brand .wm small { font-size: 7px; }

#loader .wm b { font-size: clamp(40px, 9vw, 64px); } #loader .wm small { font-size: 11px; }
#loader .wm { animation: lpulse 2.2s ease-in-out infinite; }
.logo3d .wm b { text-shadow: 0 2px 0 #8a6428, 0 0 34px rgba(0, 0, 0, .75), 0 18px 54px rgba(0, 0, 0, .95); }
.logo3d .wm small { text-shadow: 0 2px 14px rgba(0, 0, 0, .95); opacity: 1; }
.wm b { white-space: nowrap; }
.logo3d .wm b { font-size: clamp(60px, 7.2vw, 112px); } .logo3d .wm small { font-size: clamp(11px, 1.3vw, 18px); letter-spacing: .5em; }
footer .wm { margin: 0 auto 16px; } footer .wm b { font-size: 40px; } footer .wm small { font-size: 9px; }
.two { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; }
.fld input[type="date"] { color-scheme: dark; min-width: 0; }
.hint { margin-top: 12px; color: var(--gold2); font-size: 14px; min-height: 1.4em; }
.chip small { font-weight: 600; opacity: .7; margin-inline-start: 8px; font-size: 13px; }
.qty b { min-width: 46px; }
#bList li { animation: none; }
#bList li span.k { color: var(--mute); font-size: 13px; white-space: nowrap; }
#bList li b { text-align: end; font-weight: 700; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.total span { color: var(--mute); }
.total b { font-size: 30px; font-weight: 800; color: var(--gold2); font-family: "Frank Ruhl Libre", serif; }
.visit-grid { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 860px) {
  .brand .wm b { font-size: 20px; } .brand .wm small { font-size: 6px; }
  .two { grid-template-columns: 1fr; align-items: start; }
  .visit-grid { grid-template-columns: 1fr; }
  .total b { font-size: 26px; }
}

/* ---- עיצוב 2: סיור רציף לתוך האולם ---- */
#track { height: 780vh; }
.stage::before { content: ""; position: absolute; inset: 38% 0 0 0; background: linear-gradient(transparent, rgba(6, 4, 3, .82)); pointer-events: none; }
.frame { position: absolute; inset: 12px; border: 1px solid rgba(243, 214, 157, .34); pointer-events: none; }
.frame::before, .frame::after { content: ""; position: absolute; width: 26px; height: 26px; border: 1px solid var(--gold2); }
.frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.frame::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.cap.sc { left: 50%; bottom: calc(10vh + env(safe-area-inset-bottom)); width: min(820px, 86vw); text-align: center; }
.sc .num { display: block; font: 600 12px/1 "Assistant", "Noto Kufi Arabic", sans-serif; letter-spacing: .42em; color: var(--gold2); margin-bottom: 18px; }
html[lang="ar"] .sc .num { letter-spacing: .1em; font-size: 14px; }
.sc .big { font-size: clamp(40px, 5.2vw, 82px); font-weight: 700; line-height: 1.05; }
.sc .rule { display: block; width: 64px; height: 1px; margin: 22px auto 18px; background: linear-gradient(90deg, transparent, var(--gold2), transparent); }
.sc p { font-size: clamp(16px, 1.35vw, 20px); max-width: 44ch; margin: 0 auto; color: var(--ink); }
.sc .row { justify-content: center; }
.menu .kicker { letter-spacing: .3em; }
html[lang="ar"] .menu .kicker { letter-spacing: .08em; font-size: 15px; }
.dots { right: 30px; }
@media (min-width: 861px) {
  .hin { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(900px, 90vw); }
  .logo3d .wm b { font-size: clamp(72px, 9vw, 150px); }
}
@media (max-width: 860px) {
  .frame { inset: 8px; }
  .cap.sc { bottom: calc(8vh + env(safe-area-inset-bottom)); }
  .sc .big { font-size: clamp(36px, 10.5vw, 54px); }
  .dots { right: 18px; }
}

/* ================= עיצוב 3: תלת־ממד בכל פרט, מעברים מהירים ================= */
:root { --fast: cubic-bezier(.16, 1, .3, 1); }
#track { height: 470vh; }
@media (max-width: 860px) { #track { height: 430vh; } }
.cap { transition: none; }
.sc .big { transform: translateZ(60px); }

/* מסילת התחנות — מראה איפה אתם בסיור, ולחיצה קופצת לתחנה */
.dots { display: none; }
.rail { position: absolute; z-index: 3; inset-inline-end: 34px; top: 50%; transform: translateY(-50%); display: grid; gap: 22px; pointer-events: auto; padding: 4px 0; }
.rail .line { position: absolute; inset-inline-end: 3px; top: 10px; bottom: 10px; width: 1px; background: rgba(243, 214, 157, .18); }
.rail .fill { position: absolute; inset: 0; background: linear-gradient(var(--gold2), var(--gold)); transform-origin: top; transform: scaleY(0); box-shadow: 0 0 10px rgba(243, 214, 157, .5); }
.rail button { all: unset; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: flex-end; gap: 14px; font: 600 12px/1 "Assistant", "Noto Kufi Arabic", sans-serif; letter-spacing: .14em; color: rgba(246, 236, 220, .45); padding-inline-end: 20px; transition: color .3s var(--fast), transform .35s var(--fast); text-shadow: 0 2px 12px rgba(0, 0, 0, .9); }
.rail button::after { content: ""; position: absolute; inset-inline-end: 0; width: 7px; height: 7px; border-radius: 50%; background: #2a1d12; border: 1px solid rgba(243, 214, 157, .45); transition: all .35s var(--fast); }
.rail button.past::after { background: var(--gold); border-color: var(--gold); }
.rail button.on { color: var(--ink); transform: translateX(calc(-6px * var(--s, 1))); }
html[dir="rtl"] .rail button.on { --s: -1; }
