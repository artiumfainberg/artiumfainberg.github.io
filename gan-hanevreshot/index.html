<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060403">
<title>גן הנברשות — אולם וגן אירועים</title>
<meta name="description" content="אתר לדוגמה: אולם אירועים בדוי, אתר תלת־ממד בגלילה.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&family=Noto+Kufi+Arabic:wght@400;600;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root { --bg: #060403; --ink: #f6ecdc; --mute: rgba(246, 236, 220, .68); --gold: #d9b06a; --gold2: #f3d69d; --line: rgba(243, 214, 157, .2); --ease: cubic-bezier(.2, .7, .1, 1); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; }
body { font-family: 'Assistant', 'Noto Kufi Arabic', system-ui, sans-serif; background: var(--bg); overflow-x: hidden; }
html[lang="ar"] body { font-family: 'Noto Kufi Arabic', 'Assistant', system-ui, sans-serif; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100lvh; z-index: 0; display: block; }
#vids { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; overflow: hidden; }
#vids video { width: 2px; height: 2px; }

#loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); transition: opacity .9s var(--ease), visibility .9s; }
#loader img { width: min(260px, 60vw); animation: lpulse 2.2s ease-in-out infinite; }
#loader i { position: absolute; bottom: 18vh; width: 120px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: lline 1.4s ease-in-out infinite; }
#loader.off { opacity: 0; visibility: hidden; }
@keyframes lpulse { 50% { opacity: .55; transform: scale(.985); } }
@keyframes lline { 0% { transform: scaleX(.2); opacity: .2; } 50% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(.2); opacity: .2; } }

header#top { position: fixed; top: 0; inset-inline: 0; z-index: 20; height: calc(62px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left)); display: flex; align-items: center; justify-content: space-between; gap: 16px; background: linear-gradient(180deg, rgba(6, 4, 3, .7), rgba(6, 4, 3, 0)); }
.brand img { height: 36px; width: auto; filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .8)); }
.right { display: flex; align-items: center; gap: 10px; }
.lang { display: flex; background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .12); border-radius: 999px; padding: 3px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.lang button { all: unset; cursor: pointer; font: 600 13px/1 'Assistant', 'Noto Kufi Arabic', sans-serif; color: var(--mute); padding: 7px 11px; border-radius: 999px; }
.lang button.on { background: var(--ink); color: #120c08; }
#demo { position: fixed; z-index: 19; top: calc(66px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--gold2); padding: 6px 14px; border-radius: 999px; background: rgba(0, 0, 0, .5); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); white-space: nowrap; pointer-events: none; transition: opacity .4s; }

.pill { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 26px; border-radius: 999px; font-weight: 700; font-size: 16px; transition: transform .35s var(--ease), box-shadow .35s; white-space: nowrap; }
.pill.gold { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #1a1008; box-shadow: 0 12px 34px -10px rgba(217, 176, 106, .6), inset 0 1px 0 rgba(255, 255, 255, .55); }
.pill.ghost { color: var(--ink); background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .2); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.pill:hover { transform: translateY(-2px); }
.pill.sm { min-height: 38px; padding: 0 18px; font-size: 14px; }

#track { position: relative; z-index: 1; height: 620vh; }
.stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; perspective: 1000px; pointer-events: none; }
.cap { position: absolute; opacity: 0; visibility: hidden; will-change: transform, opacity; transform-style: preserve-3d; pointer-events: none; }
.cap.on { pointer-events: auto; }
.cap p, .cap h2, .cap span { text-shadow: 0 2px 24px rgba(0, 0, 0, .9), 0 0 3px rgba(0, 0, 0, .7); }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

.hero { inset: 0; }
.hin { position: absolute; left: 5vw; top: 50%; transform: translateY(-50%); width: min(500px, 34vw); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 26px; }
.hb { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.logo3d img { width: 100%; filter: drop-shadow(0 16px 40px rgba(0, 0, 0, .9)) drop-shadow(0 1px 0 rgba(255, 220, 160, .3)); }
.hero .sub { font-size: clamp(17px, 1.6vw, 21px); max-width: 28ch; }
.cue { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .3em; color: var(--ink); }
.cue i { width: 1px; height: 46px; background: linear-gradient(var(--gold), transparent); animation: cue 1.8s ease-in-out infinite; transform-origin: top; }
@keyframes cue { 0% { transform: scaleY(0); } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

.word { left: 5vw; bottom: calc(10vh + env(safe-area-inset-bottom)); max-width: min(620px, 46vw); text-align: left; }
html[dir="rtl"] .word { text-align: right; }
.word .row { justify-content: flex-start; margin-top: 22px; }
.big { font-family: 'Frank Ruhl Libre', 'Noto Kufi Arabic', serif; font-weight: 900; font-size: clamp(56px, 8.4vw, 140px); line-height: .95; letter-spacing: -.01em; color: #fff4e2; text-shadow: 0 6px 40px rgba(0, 0, 0, .85), 0 2px 4px rgba(0, 0, 0, .6); }
html[lang="ar"] .big { font-family: 'Noto Kufi Arabic', serif; font-weight: 800; line-height: 1.15; }
.big em { font-style: normal; color: var(--gold2); }
.word p { margin-top: 14px; font-size: clamp(18px, 1.5vw, 22px); max-width: 28ch; }
.word .em { color: var(--gold2); font-weight: 700; }

.menu { left: 50%; top: 50%; width: min(760px, 90vw); text-align: center; }
.menu .kicker { font-size: 13px; letter-spacing: .4em; color: var(--gold); }
#menuList { margin: 22px 0 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 40px; text-align: start; }
#menuList div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, .1); }
#menuList b { font-size: clamp(18px, 1.6vw, 22px); font-weight: 800; }
#menuList small { color: var(--mute); font-size: 14px; text-align: end; }

.dots { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
.dots i { width: 6px; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, .25); transition: height .4s var(--ease), background .4s; }
.dots i.on { height: 22px; background: var(--gold); }

.sec { position: relative; z-index: 2; padding: clamp(90px, 13vw, 160px) 0; background: var(--bg); }
.wrap { width: min(1100px, 100% - 40px); margin: 0 auto; }
.title.xl { font-family: 'Frank Ruhl Libre', 'Noto Kufi Arabic', serif; font-weight: 900; font-size: clamp(64px, 11vw, 160px); line-height: 1; background: linear-gradient(180deg, #fff6e6, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
html[lang="ar"] .title.xl { font-family: 'Noto Kufi Arabic', serif; font-weight: 800; line-height: 1.25; }
.lead { font-size: clamp(18px, 1.6vw, 22px); line-height: 1.7; color: var(--mute); margin-top: 24px; max-width: 46ch; }
.note { color: var(--mute); margin-top: 8px; font-size: 14px; }
.visit-grid { margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { border-radius: 26px; padding: 30px; background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .08); }
.card b { font-size: 28px; }
.card p { color: var(--mute); margin-top: 10px; }
.card.actions { display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start; }
.card.actions small { width: 100%; color: var(--mute); font-size: 12px; }
footer { position: relative; z-index: 2; background: var(--bg); text-align: center; padding: 60px 20px calc(60px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255, 255, 255, .06); color: var(--mute); font-size: 14px; }
footer img { height: 70px; margin: 0 auto 16px; }

@media (max-width: 860px) {
  .brand img { height: 30px; }
  header .pill { display: none; }
  .hin { left: 16px; right: 16px; width: auto; top: calc(108px + env(safe-area-inset-top)); bottom: calc(34px + env(safe-area-inset-bottom)); transform: none; justify-content: space-between; }
  .logo3d img { width: min(290px, 72vw); }
  .hero .sub { font-size: 17px; }
  .cue { display: none; }
  .word { left: 20px; right: 20px; max-width: none; bottom: calc(7vh + env(safe-area-inset-bottom)); text-align: center !important; }
  .word .row { justify-content: center; }
  .word p { margin-inline: auto; }
  .big { font-size: clamp(52px, 15vw, 76px); }
  #menuList { grid-template-columns: 1fr; gap: 0; }
  #menuList div { padding: 9px 0; }
  .visit-grid { grid-template-columns: 1fr; }
  .dots { right: 10px; }
}
@media (prefers-reduced-motion: reduce) { .cue i, #loader img, #loader i { animation: none; } }

/* ---------- תרכיב לך שווארמה ---------- */
.build { overflow: hidden; isolation: isolate; }
.bgv { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; z-index: -1; filter: blur(22px) brightness(.28) saturate(1.2); transform: scale(1.05); }
.build::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, var(--bg) 0%, rgba(6, 4, 3, .4) 18%, rgba(6, 4, 3, .4) 82%, var(--bg) 100%); }
.bgrid { margin-top: 46px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 26px; align-items: start; perspective: 1400px; }
.step { padding: 24px 26px; border-radius: 26px; background: rgba(20, 13, 9, .62); border: 1px solid rgba(255, 255, 255, .08); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); margin-bottom: 14px; transform-origin: center top; transition: transform .7s var(--ease), opacity .7s var(--ease); }
.step h3 { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 800; margin-bottom: 16px; }
.step h3 i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; color: #1a1008; background: linear-gradient(180deg, var(--gold2), var(--gold)); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { all: unset; cursor: pointer; box-sizing: border-box; min-height: 46px; padding: 0 20px; display: inline-flex; align-items: center; border-radius: 999px; font-weight: 700; font-size: 16px; color: var(--ink); background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .14); transition: transform .3s var(--ease), background .25s, border-color .25s, color .25s, box-shadow .3s; }
.chip:hover { border-color: rgba(243, 214, 157, .5); }
.chip.on { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #1a1008; border-color: transparent; box-shadow: 0 10px 26px -10px rgba(217, 176, 106, .7); transform: translateY(-2px) translateZ(20px); }
.chip:focus-visible { outline: 2px solid var(--gold2); outline-offset: 3px; }
.step.last { display: grid; gap: 16px; }
.qty { display: flex; align-items: center; gap: 14px; font-weight: 700; }
.qty button { all: unset; cursor: pointer; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .15); }
.qty b { min-width: 24px; text-align: center; font-size: 20px; }
.fld { display: grid; gap: 8px; font-size: 14px; color: var(--mute); }
.fld input { all: unset; box-sizing: border-box; min-height: 48px; padding: 0 16px; border-radius: 14px; background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .14); color: var(--ink); font-size: 16px; }
.fld input:focus { border-color: var(--gold); }
.preview { color: var(--gold2); font-weight: 600; min-height: 1.4em; }
.pill.wide { width: 100%; cursor: pointer; border: 0; font-family: inherit; }
.pill.gold[disabled], .pill.gold.off { opacity: .45; pointer-events: none; }
.order { position: sticky; top: 90px; padding: 26px; border-radius: 26px; background: rgba(20, 13, 9, .72); border: 1px solid rgba(243, 214, 157, .22); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: grid; gap: 16px; box-shadow: 0 40px 80px -40px rgba(0, 0, 0, .9); }
.order h3 { font-size: 22px; font-weight: 800; }
#bList { list-style: none; display: grid; gap: 10px; }
#bList li { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: rgba(255, 255, 255, .05); animation: pop .5s var(--ease); }
#bList li b { display: block; }
#bList li small { color: var(--mute); font-size: 13px; }
#bList li button { all: unset; cursor: pointer; font-size: 13px; color: var(--gold2); white-space: nowrap; }
#bList .empty { background: none; color: var(--mute); padding: 0; animation: none; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
.how { display: grid; gap: 8px; font-size: 14px; color: var(--mute); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .12); border-radius: 999px; padding: 4px; }
.seg button { all: unset; cursor: pointer; text-align: center; padding: 10px; border-radius: 999px; font-weight: 700; color: var(--mute); }
.seg button.on { background: var(--ink); color: #120c08; }
.order small { color: var(--mute); font-size: 12px; }
.sbar { display: none; }
@media (max-width: 860px) {
  .bgrid { grid-template-columns: 1fr; }
  .order { position: static; }
  .step { padding: 20px; }
  .chip { min-height: 44px; padding: 0 16px; font-size: 15px; }
  .sbar { position: fixed; z-index: 15; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 8px 8px 18px; border-radius: 999px; background: rgba(12, 8, 6, .85); border: 1px solid rgba(243, 214, 157, .25); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transform: translateY(140%); transition: transform .5s var(--ease); font-weight: 700; }
  html[dir="rtl"] .sbar { padding: 8px 18px 8px 8px; }
  .sbar.on { transform: none; }
}

.step.pre { opacity: 0; transform: translateY(40px) rotateX(14deg); }
.step.pre.in { opacity: 1; transform: none; }

/* ---- גן הנברשות: לוגו כתוב ותוספות למתכנן האירוע ---- */
.wm { display: inline-grid; justify-items: center; line-height: 1; font-family: "Frank Ruhl Libre", serif; }
.wm b { font-weight: 900; letter-spacing: .01em; color: #f9e9c2; text-shadow: 0 1px 0 rgba(122, 84, 24, .95), 0 2px 16px rgba(0, 0, 0, .8); }
.wm small { font-family: "Assistant", sans-serif; font-weight: 600; letter-spacing: .34em; color: var(--gold2); opacity: .85; margin-top: .5em; white-space: nowrap; }
.brand .wm b { font-size: 24px; } .brand .wm small { font-size: 7px; }

#loader .wm b { font-size: clamp(40px, 9vw, 64px); } #loader .wm small { font-size: 11px; }
#loader .wm { animation: lpulse 2.2s ease-in-out infinite; }
.logo3d .wm b { text-shadow: 0 2px 0 #8a6428, 0 0 34px rgba(0, 0, 0, .75), 0 18px 54px rgba(0, 0, 0, .95); }
.logo3d .wm small { text-shadow: 0 2px 14px rgba(0, 0, 0, .95); opacity: 1; }
.wm b { white-space: nowrap; }
.logo3d .wm b { font-size: clamp(60px, 7.2vw, 112px); } .logo3d .wm small { font-size: clamp(11px, 1.3vw, 18px); letter-spacing: .5em; }
footer .wm { margin: 0 auto 16px; } footer .wm b { font-size: 40px; } footer .wm small { font-size: 9px; }
.two { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; }
.fld input[type="date"] { color-scheme: dark; min-width: 0; }
.hint { margin-top: 12px; color: var(--gold2); font-size: 14px; min-height: 1.4em; }
.chip small { font-weight: 600; opacity: .7; margin-inline-start: 8px; font-size: 13px; }
.qty b { min-width: 46px; }
#bList li { animation: none; }
#bList li span.k { color: var(--mute); font-size: 13px; white-space: nowrap; }
#bList li b { text-align: end; font-weight: 700; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.total span { color: var(--mute); }
.total b { font-size: 30px; font-weight: 800; color: var(--gold2); font-family: "Frank Ruhl Libre", serif; }
.visit-grid { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 860px) {
  .brand .wm b { font-size: 20px; } .brand .wm small { font-size: 6px; }
  .two { grid-template-columns: 1fr; align-items: start; }
  .visit-grid { grid-template-columns: 1fr; }
  .total b { font-size: 26px; }
}

/* ---- עיצוב 2: סיור רציף לתוך האולם ---- */
#track { height: 780vh; }
.stage::before { content: ""; position: absolute; inset: 38% 0 0 0; background: linear-gradient(transparent, rgba(6, 4, 3, .82)); pointer-events: none; }
.frame { position: absolute; inset: 12px; border: 1px solid rgba(243, 214, 157, .34); pointer-events: none; }
.frame::before, .frame::after { content: ""; position: absolute; width: 26px; height: 26px; border: 1px solid var(--gold2); }
.frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.frame::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.cap.sc { left: 50%; bottom: calc(10vh + env(safe-area-inset-bottom)); width: min(820px, 86vw); text-align: center; }
.sc .num { display: block; font: 600 12px/1 "Assistant", "Noto Kufi Arabic", sans-serif; letter-spacing: .42em; color: var(--gold2); margin-bottom: 18px; }
html[lang="ar"] .sc .num { letter-spacing: .1em; font-size: 14px; }
.sc .big { font-size: clamp(40px, 5.2vw, 82px); font-weight: 700; line-height: 1.05; }
.sc .rule { display: block; width: 64px; height: 1px; margin: 22px auto 18px; background: linear-gradient(90deg, transparent, var(--gold2), transparent); }
.sc p { font-size: clamp(16px, 1.35vw, 20px); max-width: 44ch; margin: 0 auto; color: var(--ink); }
.sc .row { justify-content: center; }
.menu .kicker { letter-spacing: .3em; }
html[lang="ar"] .menu .kicker { letter-spacing: .08em; font-size: 15px; }
.dots { right: 30px; }
@media (min-width: 861px) {
  .hin { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(900px, 90vw); }
  .logo3d .wm b { font-size: clamp(72px, 9vw, 150px); }
}
@media (max-width: 860px) {
  .frame { inset: 8px; }
  .cap.sc { bottom: calc(8vh + env(safe-area-inset-bottom)); }
  .sc .big { font-size: clamp(36px, 10.5vw, 54px); }
  .dots { right: 18px; }
}

/* ================= עיצוב 3: תלת־ממד בכל פרט, מעברים מהירים ================= */
:root { --fast: cubic-bezier(.16, 1, .3, 1); }
#track { height: 470vh; }
@media (max-width: 860px) { #track { height: 430vh; } }
.cap { transition: none; }
.sc .big { transform: translateZ(60px); }

/* מסילת התחנות — מראה איפה אתם בסיור, ולחיצה קופצת לתחנה */
.dots { display: none; }
.rail { position: absolute; z-index: 3; inset-inline-end: 34px; top: 50%; transform: translateY(-50%); display: grid; gap: 22px; pointer-events: auto; padding: 4px 0; }
.rail .line { position: absolute; inset-inline-end: 3px; top: 10px; bottom: 10px; width: 1px; background: rgba(243, 214, 157, .18); }
.rail .fill { position: absolute; inset: 0; background: linear-gradient(var(--gold2), var(--gold)); transform-origin: top; transform: scaleY(0); box-shadow: 0 0 10px rgba(243, 214, 157, .5); }
.rail button { all: unset; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: flex-end; gap: 14px; font: 600 12px/1 "Assistant", "Noto Kufi Arabic", sans-serif; letter-spacing: .14em; color: rgba(246, 236, 220, .45); padding-inline-end: 20px; transition: color .3s var(--fast), transform .35s var(--fast); text-shadow: 0 2px 12px rgba(0, 0, 0, .9); }
.rail button::after { content: ""; position: absolute; inset-inline-end: 0; width: 7px; height: 7px; border-radius: 50%; background: #2a1d12; border: 1px solid rgba(243, 214, 157, .45); transition: all .35s var(--fast); }
.rail button.past::after { background: var(--gold); border-color: var(--gold); }
.rail button.on { color: var(--ink); transform: translateX(calc(-6px * var(--s, 1))); }
html[dir="rtl"] .rail button.on { --s: -1; }
.rail button.on::after { width: 11px; height: 11px; inset-inline-end: -2px; background: radial-gradient(circle at 35% 30%, #fff3d6, var(--gold) 55%, #7d5a22); border-color: transparent; box-shadow: 0 0 0 4px rgba(243, 214, 157, .14), 0 0 18px rgba(243, 214, 157, .6); }
.rail button:hover { color: var(--ink); }
.rail button:focus-visible { outline: 1px solid var(--gold2); outline-offset: 6px; border-radius: 4px; }
@media (max-width: 860px) {
  .rail { inset-inline-end: 14px; gap: 18px; }
  .rail button { font-size: 0; padding-inline-end: 0; width: 11px; height: 11px; }
  .rail button.on { transform: none; }
}

/* לוגו בתלת־ממד: זהב בעובי אמיתי עם קרן אור שעוברת עליו פעם אחת */
.logo3d { perspective: 900px; }
.logo3d .wm { transform-style: preserve-3d; animation: logoIn 1.4s var(--fast) both .2s; }
.logo3d .wm b { position: relative; background: linear-gradient(100deg, #b98a3e 0%, #f9e7bd 22%, #fff8e6 30%, #d9b06a 46%, #8f6526 62%, #f3d69d 80%, #c79a50 100%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 1px 0 #9a7232) drop-shadow(0 2px 0 #7e5b25) drop-shadow(0 3px 0 #634719) drop-shadow(0 4px 0 #4a3412) drop-shadow(0 22px 40px rgba(0, 0, 0, .85)); animation: sweep 7s ease-in-out infinite 1.6s; }
@keyframes logoIn { from { opacity: 0; transform: rotateX(38deg) translateZ(-260px) translateY(30px); } to { opacity: 1; transform: none; } }
@keyframes sweep { 0%, 55% { background-position: 100% 0; } 85%, 100% { background-position: 0% 0; } }

/* כפתורים: זהב עם עובי, לחיצה פיזית */
.pill { position: relative; transition: transform .25s var(--fast), box-shadow .25s var(--fast), filter .25s; }
.pill.gold { background: linear-gradient(180deg, #fbe6b8 0%, var(--gold2) 30%, var(--gold) 70%, #b48a45 100%); box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 -2px 0 rgba(90, 60, 20, .35) inset, 0 4px 0 #7a5524, 0 14px 30px -10px rgba(217, 176, 106, .75); }
.pill.gold:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 -2px 0 rgba(90, 60, 20, .35) inset, 0 6px 0 #7a5524, 0 22px 40px -12px rgba(217, 176, 106, .85); }
.pill.gold:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset, 0 1px 0 #7a5524, 0 6px 14px -8px rgba(217, 176, 106, .7); }
.pill.ghost { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 10px 26px -14px rgba(0, 0, 0, .9); }
.pill.ghost:hover { border-color: rgba(243, 214, 157, .55); }

/* כותרת עליונה: זכוכית אחרי הסיור, בורר שפה עם סמן זהב */
header#top { transition: background .35s var(--fast), backdrop-filter .35s; }
header#top.solid { background: rgba(10, 7, 5, .72); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); box-shadow: 0 1px 0 rgba(243, 214, 157, .14); }
.lang button { transition: color .25s, background .25s, box-shadow .25s; }
.lang button.on { background: linear-gradient(180deg, #fbe6b8, var(--gold)); color: #1a1008; box-shadow: 0 2px 0 #7a5524, 0 6px 16px -6px rgba(217, 176, 106, .8); }

/* כותרות ענק בזהב עם עומק */
.title.xl { background: linear-gradient(100deg, #c99c55 0%, #fff4dc 28%, #f3d69d 45%, #a77c38 70%, #f6dfae 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 1px 0 #9a7232) drop-shadow(0 2px 0 #6f4f1d) drop-shadow(0 3px 0 #4a3412) drop-shadow(0 26px 40px rgba(0, 0, 0, .7)); animation: sweep 8s ease-in-out infinite; }
.rise { opacity: 0; transform: perspective(1000px) translateY(50px) rotateX(24deg) translateZ(-120px); transition: opacity .7s var(--fast), transform .8s var(--fast); }
.rise.in { opacity: 1; transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }
.card.rise.in { transition: opacity .7s var(--fast), transform .25s var(--fast); }

/* המעבר מהסיור לתכנון: הדף עולה מעל הסיור עם קצה זהב */
.sec.build { border-radius: 34px 34px 0 0; box-shadow: 0 -40px 80px -20px rgba(0, 0, 0, .9); margin-top: -1px; }
.sec.build::before { content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold2), transparent); z-index: 1; }

/* שלבים וסיכום: לוחות זכוכית בתלת־ממד, אור שעוקב אחרי העכבר ומסגרת זהב שנדלקת */
.step, .order, .card { --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 0%; position: relative; isolation: isolate; transform-style: preserve-3d; }
.step.pre.in { transform: perspective(1000px) rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .25s var(--fast), opacity .7s var(--fast); }
.order { transform: perspective(1000px) rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .25s var(--fast); }
.step::before, .order::before, .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2; background: radial-gradient(420px circle at var(--mx) var(--my), rgba(255, 228, 175, .13), transparent 45%); opacity: 0; transition: opacity .3s; }
.step::after, .order::after, .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2; background: radial-gradient(300px circle at var(--mx) var(--my), rgba(255, 226, 160, .9), rgba(243, 214, 157, .14) 55%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .55; transition: opacity .3s; }
.lit::before, .lit::after { opacity: 1; }
.step { border-color: transparent; background: linear-gradient(160deg, rgba(36, 25, 17, .78), rgba(14, 9, 6, .72)); box-shadow: 0 30px 60px -34px rgba(0, 0, 0, .95), inset 0 1px 0 rgba(255, 240, 210, .06); }
.order { border-color: transparent; background: linear-gradient(160deg, rgba(40, 28, 18, .86), rgba(14, 9, 6, .82)); box-shadow: 0 50px 90px -40px rgba(0, 0, 0, .95), inset 0 1px 0 rgba(255, 240, 210, .08); }
.step h3 i { width: 34px; height: 34px; font-weight: 800; background: radial-gradient(circle at 35% 28%, #fff3d6, var(--gold2) 35%, var(--gold) 65%, #7d5a22); box-shadow: 0 3px 0 #6b4a1e, 0 8px 16px -6px rgba(0, 0, 0, .8), inset 0 -2px 3px rgba(90, 60, 20, .4); text-shadow: 0 1px 0 rgba(255, 245, 220, .6); }
.step h3 { font-family: "Frank Ruhl Libre", "Noto Kufi Arabic", serif; font-size: 22px; }
html[lang="ar"] .step h3 { font-family: "Noto Kufi Arabic", serif; }

/* צ'יפים: מקשים בעלי עובי שנלחצים פנימה */
.chip { background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .03)); border-color: rgba(255, 255, 255, .13); box-shadow: 0 3px 0 rgba(0, 0, 0, .55), 0 10px 18px -12px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .08); transition: transform .2s var(--fast), box-shadow .2s var(--fast), background .2s, color .2s, border-color .2s; }
.chip:hover { transform: translateY(-2px); box-shadow: 0 5px 0 rgba(0, 0, 0, .55), 0 14px 22px -12px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .1); }
.chip:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .06); }
.chip.on { background: linear-gradient(180deg, #fbe6b8, var(--gold2) 35%, var(--gold) 80%, #b48a45); box-shadow: 0 3px 0 #7a5524, 0 14px 26px -12px rgba(217, 176, 106, .85), inset 0 1px 0 rgba(255, 255, 255, .55); transform: translateY(-1px); }
.qty button { background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .14), rgba(255, 255, 255, .03)); box-shadow: 0 3px 0 rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .12); transition: transform .15s var(--fast), box-shadow .15s; }
.qty button:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0, 0, 0, .6); }
.qty b { font-family: "Frank Ruhl Libre", serif; font-size: 26px; color: var(--gold2); }
.fld input { box-shadow: inset 0 2px 6px rgba(0, 0, 0, .55), 0 1px 0 rgba(255, 255, 255, .05); transition: border-color .2s, box-shadow .2s; }
.fld input:focus { box-shadow: inset 0 2px 6px rgba(0, 0, 0, .55), 0 0 0 3px rgba(243, 214, 157, .14); }

/* הסכום: מספר זהב שמתגלגל */
.total b { background: linear-gradient(180deg, #fff2d2, var(--gold) 70%, #a47a36); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 #5a3f16) drop-shadow(0 10px 16px rgba(0, 0, 0, .6)); font-variant-numeric: tabular-nums; }
.total b.tick { animation: tick .45s var(--fast); }
@keyframes tick { 40% { transform: translateY(-3px) scale(1.04); } }
#bList li { background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .025)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); }

/* כרטיסי "בואו לראות": כל כרטיס הוא חלון לסרטון אמיתי מהאולם */
.visit-grid { perspective: 1400px; }
.card.media { overflow: hidden; min-height: 300px; display: flex; flex-direction: column; justify-content: flex-end; border-color: transparent; background: #0d0907; box-shadow: 0 40px 70px -34px rgba(0, 0, 0, .95); }
.card.media .cv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; filter: brightness(.55) saturate(1.05); transform: scale(1.08) translate3d(calc((50% - var(--mx)) * .06), calc((50% - var(--my)) * .06), 0); transition: transform .4s var(--fast), filter .4s; }
.card.media:hover .cv { filter: brightness(.68) saturate(1.1); }
.card.media > *:not(.cv) { transform: translateZ(40px); }
.card.media::before { opacity: 1; background: linear-gradient(180deg, rgba(8, 5, 4, .1) 0%, rgba(8, 5, 4, .55) 45%, rgba(8, 5, 4, .92) 100%), radial-gradient(420px circle at var(--mx) var(--my), rgba(255, 228, 175, .12), transparent 45%); z-index: -1; }
.card.media .cn { position: absolute; top: 22px; inset-inline-start: 26px; font: 700 13px/1 "Assistant", sans-serif; letter-spacing: .3em; color: var(--gold2); }
.card.media b { font-family: "Frank Ruhl Libre", "Noto Kufi Arabic", serif; color: #fff4e2; text-shadow: 0 2px 14px rgba(0, 0, 0, .8); }
html[lang="ar"] .card.media b { font-family: "Noto Kufi Arabic", serif; }
.card.media p { color: rgba(246, 236, 220, .82); }
.card.media.actions { justify-content: flex-end; flex-direction: row; flex-wrap: wrap; align-content: flex-end; }

/* תחתית: סרטון האולם מאחורי סמל בזהב */
footer { overflow: hidden; isolation: isolate; padding-top: 120px; padding-bottom: calc(110px + env(safe-area-inset-bottom)); perspective: 900px; }
footer .fv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; filter: brightness(.28) saturate(1.1); }
footer::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, var(--bg), rgba(6, 4, 3, .3) 40%, rgba(6, 4, 3, .6) 80%, var(--bg)); }
footer .fwm b { font-size: clamp(54px, 8vw, 110px); background: linear-gradient(100deg, #b98a3e, #f9e7bd 25%, #fff8e6 32%, #d9b06a 48%, #8f6526 64%, #f3d69d 82%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 1px 0 #9a7232) drop-shadow(0 2px 0 #7e5b25) drop-shadow(0 3px 0 #4a3412) drop-shadow(0 20px 36px rgba(0, 0, 0, .9)); animation: sweep 8s ease-in-out infinite; }
footer .fwm small { font-size: 12px; }
footer p { margin-top: 10px; }

/* הכיתובים בסיור: נכנסים מהעומק */
.sc .num { display: inline-block; padding: 8px 14px; border: 1px solid rgba(243, 214, 157, .35); border-radius: 999px; background: rgba(8, 5, 4, .35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.sc .big { color: #fff6e6; text-shadow: 0 1px 0 #c9a46a, 0 2px 0 #9a7232, 0 3px 0 #6f4f1d, 0 4px 0 #4a3412, 0 18px 40px rgba(0, 0, 0, .95), 0 0 2px rgba(0, 0, 0, .6); }
.sc .big em { color: var(--gold2); }
#menuList div { border-bottom-color: rgba(243, 214, 157, .16); }
#menuList b { color: #fff4e2; }

@media (max-width: 860px) {
  .card.media { min-height: 240px; }
  .sec.build { border-radius: 26px 26px 0 0; }
}
@media (prefers-reduced-motion: reduce) {
  .logo3d .wm, .logo3d .wm b, .title.xl, footer .fwm b { animation: none; }
  .rise { opacity: 1; transform: none; }
}

.rail { transition: opacity .3s var(--fast); }
.rail.hide { opacity: 0; pointer-events: none; }

/* ---------- ביקורות לדוגמה: קרוסלה בתלת־ממד ---------- */
.sec.reviews { overflow: hidden; padding-bottom: clamp(70px, 9vw, 120px); background: radial-gradient(900px 500px at 50% 65%, rgba(217, 176, 106, .09), transparent 70%), var(--bg); }
.flow { position: relative; height: 430px; margin-top: 30px; perspective: 1400px; perspective-origin: 50% 40%; touch-action: pan-y; cursor: grab; outline: none; user-select: none; -webkit-user-select: none; }
.flow:active { cursor: grabbing; }
.flow-in { position: absolute; inset: 0; transform-style: preserve-3d; }
.rcard { --lit: 1; position: absolute; left: 50%; top: 20px; width: min(440px, 80vw); margin-left: calc(min(440px, 80vw) / -2); padding: 34px 34px 28px; border-radius: 28px; background: linear-gradient(160deg, rgba(44, 31, 20, .96), rgba(14, 9, 6, .96)); box-shadow: 0 50px 80px -40px rgba(0, 0, 0, .95), inset 0 1px 0 rgba(255, 240, 210, .08); transform-style: preserve-3d; will-change: transform, opacity; filter: brightness(calc(.55 + var(--lit) * .45)); }
.rcard::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; background: linear-gradient(150deg, rgba(255, 226, 160, calc(.2 + var(--lit) * .7)), rgba(243, 214, 157, .08) 45%, rgba(243, 214, 157, calc(.1 + var(--lit) * .35))); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.rcard::before { content: "”"; position: absolute; top: -18px; inset-inline-end: 26px; font: 900 120px/1 "Frank Ruhl Libre", serif; background: linear-gradient(180deg, #fff2d2, var(--gold) 70%, #8f6526); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 #5a3f16) drop-shadow(0 12px 18px rgba(0, 0, 0, .7)); transform: translateZ(50px); }
.rtag { display: inline-block; font: 700 11px/1 "Assistant", "Noto Kufi Arabic", sans-serif; letter-spacing: .18em; color: var(--gold2); padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(243, 214, 157, .35); background: rgba(0, 0, 0, .3); }
.stars { display: flex; gap: 5px; margin: 18px 0 14px; transform: translateZ(30px); }
.stars i { width: 16px; height: 16px; background: linear-gradient(180deg, #fff1cf, var(--gold) 60%, #94692a); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); filter: drop-shadow(0 1px 0 #5a3f16); }
.rcard blockquote { font-family: "Frank Ruhl Libre", "Noto Kufi Arabic", serif; font-size: clamp(19px, 1.55vw, 22px); line-height: 1.55; color: #fff4e2; min-height: 6.2em; transform: translateZ(24px); }
html[lang="ar"] .rcard blockquote { font-family: "Noto Kufi Arabic", serif; font-size: clamp(16px, 1.35vw, 19px); line-height: 1.8; }
.rcard figcaption { display: flex; flex-direction: column; gap: 4px; margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(243, 214, 157, .18); transform: translateZ(18px); }
.rcard figcaption b { font-size: 17px; color: var(--gold2); }
.rcard figcaption small { color: var(--mute); font-size: 14px; }
.flow-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 10px; }
.fbtn { all: unset; cursor: pointer; min-height: 44px; padding: 0 22px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--ink); background: linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03)); border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 3px 0 rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08); transition: transform .2s var(--fast), box-shadow .2s, border-color .2s; }
.fbtn:hover { border-color: rgba(243, 214, 157, .5); transform: translateY(-2px); }
.fbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .55); }
.fbtn:focus-visible, .flow:focus-visible { outline: 2px solid var(--gold2); outline-offset: 4px; }
.fdots { display: flex; gap: 8px; }
.fdots button { all: unset; cursor: pointer; width: 7px; height: 7px; border-radius: 7px; background: rgba(243, 214, 157, .25); transition: width .3s var(--fast), background .3s; }
.fdots button.on { width: 26px; background: linear-gradient(90deg, var(--gold2), var(--gold)); }
@media (max-width: 860px) {
  .flow { height: 440px; }
  .rcard { padding: 30px 24px 24px; }
  .fbtn { padding: 0 16px; }
}

/* הפס הצף של "סיכום האירוע" מופיע רק בתוך אזור התכנון, ונעלם לגמרי מחוצה לו */
@media (max-width: 860px) {
  .sbar { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(calc(100% + 40px + env(safe-area-inset-bottom))); transition: transform .35s var(--fast), opacity .25s, visibility .35s; }
  .sbar.on { opacity: 1; visibility: visible; pointer-events: auto; transform: none; }
}

/* ---- גרסה אוטומטית: הסיור מתנגן לבד במסך אחד, הגלילה רק ממשיכה לשאר האתר ---- */
html.auto #track { height: 100vh; height: 100svh; }

/* ---- גרסה אוטומטית: השולחן והרחבה כחלקים משלהם בהמשך הדף ---- */
.auto-only { display: none; }
html.auto .auto-only { display: block; }
.vscene { position: relative; z-index: 2; height: 118vh; height: 118svh; }
.vwin { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; isolation: isolate; transform-origin: 50% 100%; box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .95), 0 0 0 1px rgba(243, 214, 157, .22); }
.vwin .cv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; filter: brightness(.86); }
.vwin::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(6, 4, 3, .45) 0%, rgba(6, 4, 3, 0) 30%, rgba(6, 4, 3, .15) 55%, rgba(6, 4, 3, .88) 100%); }
.vcap { position: absolute; left: 50%; bottom: calc(10vh + env(safe-area-inset-bottom)); width: min(820px, 88vw); text-align: center; transform: translate(-50%, calc((1 - var(--k, 1)) * 60px)); opacity: var(--k, 1); }
.vcap .num { display: inline-block; font: 600 12px/1 "Assistant", "Noto Kufi Arabic", sans-serif; letter-spacing: .3em; color: var(--gold2); padding: 8px 14px; border: 1px solid rgba(243, 214, 157, .35); border-radius: 999px; background: rgba(8, 5, 4, .35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); margin-bottom: 18px; }
.vcap .big { font-size: clamp(40px, 5.2vw, 82px); font-weight: 700; line-height: 1.05; color: #fff6e6; text-shadow: 0 1px 0 #c9a46a, 0 2px 0 #9a7232, 0 3px 0 #6f4f1d, 0 4px 0 #4a3412, 0 18px 40px rgba(0, 0, 0, .95); }
html[lang="ar"] .vcap .big { font-family: "Noto Kufi Arabic", serif; font-weight: 800; line-height: 1.2; }
.vcap .big em { font-style: normal; color: var(--gold2); }
.vcap .rule { display: block; width: 64px; height: 1px; margin: 22px auto 20px; background: linear-gradient(90deg, transparent, var(--gold2), transparent); }
.vmenu { bottom: auto; top: 50%; transform: translate(-50%, calc(-50% + (1 - var(--k, 1)) * 60px)); }
#sFloor .vwin .cv { filter: brightness(.5) saturate(1.05); }
.mlist { margin: 6px 0 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 40px; text-align: start; }
.mlist div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 13px 0; border-bottom: 1px solid rgba(243, 214, 157, .18); }
.mlist b { font-size: clamp(18px, 1.6vw, 22px); font-weight: 800; color: #fff4e2; text-shadow: 0 2px 12px rgba(0, 0, 0, .9); }
.mlist small { color: rgba(246, 236, 220, .78); font-size: 14px; text-align: end; text-shadow: 0 2px 10px rgba(0, 0, 0, .9); }
html.auto .sec.build { margin-top: 0; }
@media (max-width: 860px) {
  .vcap .big { font-size: clamp(36px, 10.5vw, 54px); }
  .mlist { grid-template-columns: 1fr; gap: 0; }
  .mlist div { padding: 10px 0; }
}

/* ================= תכננו את האירוע — גרסת פרימיום ================= */
.build .wrap { width: min(1220px, 100% - 32px); }
/* פס התקדמות: ארבע תחנות עם קו זהב שמתמלא */

/* כרטיסי אירוע — תמונות אמיתיות מהאולם */
.evgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; perspective: 1200px; }
.ev { all: unset; cursor: pointer; position: relative; aspect-ratio: 4 / 5; border-radius: 22px; overflow: hidden; isolation: isolate; display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box; box-shadow: 0 18px 34px -18px rgba(0, 0, 0, .95), inset 0 0 0 1px rgba(243, 214, 157, .14); transition: transform .35s var(--fast), box-shadow .35s var(--fast); transform-style: preserve-3d; }
.ev-img { position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center; filter: brightness(.55) saturate(.9); transform: scale(1.08); transition: transform .6s var(--fast), filter .4s; }
.ev::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(6, 4, 3, 0) 35%, rgba(6, 4, 3, .9)); }
.ev-n { font-family: "Frank Ruhl Libre", "Noto Kufi Arabic", serif; font-size: clamp(18px, 1.6vw, 22px); font-weight: 700; color: #fff4e2; text-shadow: 0 2px 12px rgba(0, 0, 0, .9); line-height: 1.2; }
html[lang="ar"] .ev-n { font-family: "Noto Kufi Arabic", serif; font-size: 16px; }
.ev-c { position: absolute; top: 12px; inset-inline-end: 12px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .35); background: rgba(0, 0, 0, .3); transition: all .3s var(--fast); }
.ev-c::after { content: ""; position: absolute; left: 8px; top: 5px; width: 6px; height: 11px; border: solid #1a1008; border-width: 0 2px 2px 0; transform: rotate(45deg) scale(0); transition: transform .3s var(--fast); }
.ev:hover { transform: translateY(-4px); }
.ev:hover .ev-img { transform: scale(1.14); filter: brightness(.7); }
.ev.on { transform: translateY(-6px) rotateX(4deg); box-shadow: 0 30px 50px -22px rgba(0, 0, 0, .95), 0 0 0 2px var(--gold2), 0 0 34px -6px rgba(243, 214, 157, .55); }
.ev.on .ev-img { filter: brightness(.85) saturate(1.05); transform: scale(1.12); }
.ev.on .ev-c { background: radial-gradient(circle at 35% 30%, #fff3d6, var(--gold) 60%, #8f6526); border-color: transparent; box-shadow: 0 0 14px rgba(243, 214, 157, .7); }
.ev.on .ev-c::after { transform: rotate(45deg) scale(1); }
.ev:focus-visible, .mc:focus-visible, .xr:focus-visible, .cd:focus-visible { outline: 2px solid var(--gold2); outline-offset: 3px; }

/* לוח שנה */
.cal { border-radius: 22px; padding: 18px; background: linear-gradient(180deg, rgba(0, 0, 0, .35), rgba(0, 0, 0, .2)); box-shadow: inset 0 0 0 1px rgba(243, 214, 157, .12), inset 0 2px 10px rgba(0, 0, 0, .4); }

.ch b { font-family: "Frank Ruhl Libre", "Noto Kufi Arabic", serif; font-size: 20px; color: var(--gold2); }
.cnav { all: unset; cursor: pointer; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; color: var(--ink); background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .14), rgba(255, 255, 255, .03)); box-shadow: 0 3px 0 rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .12); }

.cd:hover:not([disabled]) { transform: translateY(-2px); background: rgba(255, 255, 255, .08); }
.cd[disabled] { opacity: .2; cursor: default; }
.cd.on { background: radial-gradient(circle at 35% 25%, #fff3d6, var(--gold2) 40%, var(--gold) 75%, #94692a); color: #1a1008; box-shadow: 0 3px 0 #6b4a1e, 0 10px 22px -8px rgba(217, 176, 106, .8); transform: translateY(-2px); }
.cd.on small { color: #4a3412; }

/* בורר מוזמנים */
.gsel { margin-top: 22px; padding: 20px 20px 16px; border-radius: 22px; background: linear-gradient(180deg, rgba(0, 0, 0, .35), rgba(0, 0, 0, .2)); box-shadow: inset 0 0 0 1px rgba(243, 214, 157, .12); }
.gtop { display: flex; align-items: baseline; justify-content: space-between; color: var(--mute); font-weight: 700; }
.gtop b { font: 900 clamp(40px, 4.4vw, 56px)/1 "Frank Ruhl Libre", serif; background: linear-gradient(180deg, #fff2d2, var(--gold) 70%, #a47a36); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 #5a3f16) drop-shadow(0 10px 16px rgba(0, 0, 0, .6)); font-variant-numeric: tabular-nums; }
#gRange { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin-top: 10px; background: transparent; cursor: pointer; --v: 28.6%; }
#gRange::-webkit-slider-runnable-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--gold) 0 var(--v), rgba(255, 255, 255, .1) var(--v)); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .6); }
html[dir="rtl"] #gRange::-webkit-slider-runnable-track { background: linear-gradient(270deg, var(--gold) 0 var(--v), rgba(255, 255, 255, .1) var(--v)); }
#gRange::-moz-range-track { height: 8px; border-radius: 8px; background: rgba(255, 255, 255, .1); }
#gRange::-moz-range-progress { height: 8px; border-radius: 8px; background: var(--gold); }
#gRange::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -11px; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #fff6e0, var(--gold2) 40%, var(--gold) 70%, #7d5a22); box-shadow: 0 3px 0 #5a3f16, 0 8px 16px rgba(0, 0, 0, .6), 0 0 0 5px rgba(243, 214, 157, .14); }
#gRange::-moz-range-thumb { width: 30px; height: 30px; border: 0; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #fff6e0, var(--gold2) 40%, var(--gold) 70%, #7d5a22); box-shadow: 0 3px 0 #5a3f16, 0 8px 16px rgba(0, 0, 0, .6); }
.gticks { display: flex; justify-content: space-between; font-size: 11px; color: rgba(246, 236, 220, .4); margin-top: 2px; }
.ginfo { margin-top: 12px; color: var(--gold2); font-size: 14px; font-weight: 600; }

/* כרטיסי תפריט */
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; perspective: 1200px; }
.mc { all: unset; cursor: pointer; position: relative; box-sizing: border-box; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(36, 25, 17, .95), rgba(14, 9, 6, .95)); box-shadow: 0 20px 40px -22px rgba(0, 0, 0, .95), inset 0 0 0 1px rgba(243, 214, 157, .14); transition: transform .35s var(--fast), box-shadow .35s var(--fast); }
.mc-img { height: 110px; background-size: cover; background-position: center; filter: brightness(.8); transition: filter .4s, transform .6s var(--fast); }
.mc-b { padding: 16px 16px 18px; display: grid; gap: 8px; }
.mc-n { font-family: "Frank Ruhl Libre", "Noto Kufi Arabic", serif; font-size: 22px; font-weight: 700; color: #fff4e2; }

.mc-p { display: flex; align-items: baseline; gap: 6px; }
.mc-p b { font: 900 34px/1 "Frank Ruhl Libre", serif; background: linear-gradient(180deg, #fff2d2, var(--gold) 70%, #a47a36); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 #5a3f16); }
.mc-p small { color: var(--mute); font-size: 13px; }
.mc ul { list-style: none; display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid rgba(243, 214, 157, .14); }
.mc li { font-size: 13.5px; color: rgba(246, 236, 220, .82); display: flex; gap: 8px; align-items: center; }
.mc li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex: none; box-shadow: 0 0 6px rgba(243, 214, 157, .7); }
.mc-pop { position: absolute; z-index: 2; top: 12px; inset-inline-start: 12px; font: 800 11px/1 "Assistant", "Noto Kufi Arabic", sans-serif; letter-spacing: .08em; color: #1a1008; padding: 7px 11px; border-radius: 999px; background: linear-gradient(180deg, #fbe6b8, var(--gold)); box-shadow: 0 2px 0 #7a5524, 0 6px 14px rgba(0, 0, 0, .5); }
.mc-c { position: absolute; top: 12px; inset-inline-end: 12px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .35); background: rgba(0, 0, 0, .35); transition: all .3s var(--fast); }
.mc-c::after { content: ""; position: absolute; left: 8px; top: 5px; width: 6px; height: 11px; border: solid #1a1008; border-width: 0 2px 2px 0; transform: rotate(45deg) scale(0); transition: transform .3s var(--fast); }
.mc:hover { transform: translateY(-4px); }
.mc:hover .mc-img { filter: brightness(.95); transform: scale(1.05); }
.mc.on { transform: translateY(-8px) rotateX(3deg); box-shadow: 0 34px 60px -26px rgba(0, 0, 0, .95), 0 0 0 2px var(--gold2), 0 0 40px -8px rgba(243, 214, 157, .55); }
.mc.on .mc-c { background: radial-gradient(circle at 35% 30%, #fff3d6, var(--gold) 60%, #8f6526); border-color: transparent; }
.mc.on .mc-c::after { transform: rotate(45deg) scale(1); }

/* תוספות — שורות עם מתג זהב */
.xlist { display: grid; gap: 10px; }
.xr { all: unset; cursor: pointer; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: rgba(255, 255, 255, .035); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07); transition: background .25s, box-shadow .25s, transform .2s var(--fast); }
.xr:hover { background: rgba(255, 255, 255, .06); }
.xn { font-weight: 700; font-size: 16px; }
.xp { color: var(--gold2); font-size: 13px; font-weight: 700; white-space: nowrap; }
.sw { position: relative; width: 48px; height: 28px; border-radius: 28px; background: rgba(0, 0, 0, .5); box-shadow: inset 0 2px 5px rgba(0, 0, 0, .7), inset 0 0 0 1px rgba(255, 255, 255, .1); transition: background .3s; }
.sw i { position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #cfc6b8); box-shadow: 0 2px 4px rgba(0, 0, 0, .6); transition: transform .3s var(--fast), background .3s; }

html[dir="ltr"] .xr.on .sw i { transform: translateX(20px); }

/* הסיכום: הזמנה מודפסת עם מסגרת זהב כפולה */
.inv { --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 0%; position: sticky; top: 90px; border-radius: 26px; padding: 10px; background: linear-gradient(160deg, #2a1d12, #120c08); box-shadow: 0 60px 100px -45px rgba(0, 0, 0, .95), 0 0 0 1px rgba(243, 214, 157, .3); transform: perspective(1100px) rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .25s var(--fast); isolation: isolate; overflow: hidden; }
.inv::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(420px circle at var(--mx) var(--my), rgba(255, 228, 175, .1), transparent 45%); }
.inv::after { content: ""; position: absolute; top: 0; bottom: 0; width: 60%; left: -80%; z-index: 3; pointer-events: none; background: linear-gradient(100deg, transparent, rgba(255, 236, 190, .28), transparent); transform: skewX(-18deg); opacity: 0; }
.inv.seal::after { animation: foil 1.2s var(--fast) both; }

@keyframes foil { 0% { left: -80%; opacity: 1; } 100% { left: 130%; opacity: 1; } }
@keyframes lift { 40% { transform: perspective(1100px) translateY(-8px) rotateX(4deg) scale(1.015); } }
.inv-in { position: relative; border-radius: 20px; padding: 28px 24px 22px; display: grid; gap: 14px; text-align: center; border: 1px solid rgba(243, 214, 157, .45); box-shadow: inset 0 0 0 5px rgba(18, 12, 8, .9), inset 0 0 0 6px rgba(243, 214, 157, .22); background: radial-gradient(120% 80% at 50% 0%, rgba(217, 176, 106, .1), transparent 60%); }

.inv-t { font: 900 clamp(34px, 3.4vw, 46px)/1.08 "Frank Ruhl Libre", serif; background: linear-gradient(100deg, #c99c55, #fff4dc 30%, #f3d69d 50%, #a77c38 75%, #f6dfae); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 #9a7232) drop-shadow(0 2px 0 #4a3412) drop-shadow(0 14px 22px rgba(0, 0, 0, .6)); }
html[lang="ar"] .inv-t { font-family: "Noto Kufi Arabic", serif; font-weight: 800; line-height: 1.3; }
.inv-d { color: var(--ink); font-size: 15px; min-height: 1.5em; }
.inv-rule { display: block; width: 90px; height: 1px; margin: 2px auto; background: linear-gradient(90deg, transparent, var(--gold2), transparent); }

.inv-need { color: var(--gold2); font-size: 13px; font-weight: 700; }

@media (max-width: 860px) {

}

}
